<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2563EB">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='17' fill='%232563EB'/%3E%3Cpath d='M27 13a10 10 0 1 0 2 9h-8' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='31' cy='9' r='5' fill='%23FFD43B'/%3E%3C/svg%3E">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Gokski</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: phone-first app — brand bar, "continue" hero with goal ring, winding journey road per unit, fixed bottom nav; full-screen lesson player with mascot speech bubble and slide-up feedback sheet */
:root{
  --bg:#EEF3FF; --surface:#FFFFFF; --surface-2:#F6F9FF; --ink:#0B1B3F; --muted:#56658A; --line:#D7E0F3;
  --teal:#2563EB; --teal-d:#1846B0; --teal-soft:#DFE8FD;
  --coral:#2563EB; --coral-d:#1846B0; --coral-soft:#DFE8FD;
  --sun:#FFD43B; --sun-d:#D9AE0F; --sun-soft:#FFF5CC; --on-sun:#0B1B3F;
  --ok:#16A34A; --ok-d:#0F7A36; --ok-bg:#DCF5E4;
  --bad:#E5484D; --bad-d:#B3262C; --bad-bg:#FDE6E7;
  --lock:#D6DEEE; --lock-d:#BAC6DE;
  --shadow:0 10px 30px -12px rgba(11,27,63,.25);
  --f-display:'Bricolage Grotesque','Noto Sans Georgian',system-ui,sans-serif;
  --f-body:'Noto Sans Georgian','Bricolage Grotesque',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1226; --surface:#111C38; --surface-2:#0D1730; --ink:#E7EDFF; --muted:#8E9CC2; --line:#22305A;
  --teal:#4F8BFF; --teal-d:#2C62D6; --teal-soft:#16254D;
  --coral:#4F8BFF; --coral-d:#2C62D6; --coral-soft:#16254D;
  --sun:#FFD43B; --sun-d:#C79B05; --sun-soft:#3A3212; --on-sun:#0B1B3F;
  --ok:#3DD47A; --ok-d:#1F9A52; --ok-bg:#0F3320;
  --bad:#FF6B70; --bad-d:#B8333D; --bad-bg:#3A171B;
  --lock:#1D2A4A; --lock-d:#141F3A; --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A1226; --surface:#111C38; --surface-2:#0D1730; --ink:#E7EDFF; --muted:#8E9CC2; --line:#22305A;
  --teal:#4F8BFF; --teal-d:#2C62D6; --teal-soft:#16254D;
  --coral:#4F8BFF; --coral-d:#2C62D6; --coral-soft:#16254D;
  --sun:#FFD43B; --sun-d:#C79B05; --sun-soft:#3A3212; --on-sun:#0B1B3F;
  --ok:#3DD47A; --ok-d:#1F9A52; --ok-bg:#0F3320;
  --bad:#FF6B70; --bad-d:#B8333D; --bad-bg:#3A171B;
  --lock:#1D2A4A; --lock-d:#141F3A; --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
.player>.wrap,.player>main{width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.wrap{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.en-t{font-family:var(--f-display)}

/* ---------- top brand bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top .wrap{display:flex;align-items:center;gap:8px;padding-block:12px}
@font-face{font-family:'Jost';font-weight:300;font-style:normal;font-display:swap;src:url('/fonts/jost-300.woff2') format('woff2')}
@font-face{font-family:'Archivo Black';font-weight:400 900;font-style:normal;font-display:swap;src:url('/fonts/archivo-black.woff2') format('woff2')}
.logo{display:flex;align-items:center;gap:8px;margin-right:auto;color:var(--ink);line-height:1}
.logo svg{width:34px;height:34px;flex:none}
.wm{display:flex;align-items:baseline;font-size:25px;white-space:nowrap}
.wm .a{font-family:'Jost','Century Gothic','Futura',system-ui,sans-serif;font-weight:300;letter-spacing:-.01em}
.wm .b{font-family:'Archivo Black','Arial Black','Helvetica Neue',system-ui,sans-serif;font-weight:900;color:var(--teal);letter-spacing:-.02em;font-size:.9em}
.chip{display:flex;align-items:center;gap:4px;padding:5px 10px 5px 7px;border-radius:99px;background:var(--surface);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line) inset;font-family:var(--f-display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.chip svg{width:19px;height:19px}
.c-fire{color:#F07A22}.c-xp{color:var(--sun-d)}.c-heart{color:var(--bad)}

/* ---------- hero ---------- */
main.home{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.hero{position:relative;overflow:hidden;margin-top:6px;padding:20px;border-radius:26px;color:#fff;background:
  radial-gradient(110% 80% at 100% 0%,rgba(255,212,59,.38) 0%,transparent 55%),
  linear-gradient(150deg,#2F6BF0 0%,#1846B0 100%);box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1.2px,transparent 1.3px);background-size:16px 16px;mask-image:linear-gradient(200deg,#000,transparent 60%);pointer-events:none}
.hero-row{position:relative;z-index:1;display:flex;gap:16px;align-items:center}
.hero-txt{flex:1;min-width:0}
.hero small{display:block;font-size:13px;opacity:.85;font-weight:600}
.hero h1{margin:2px 0 4px;font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.hero p{margin:0;opacity:.88;font-size:14px}
.ring{flex:none;position:relative;width:86px;height:86px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1}
.ring b span{display:block;font-size:10px;font-weight:600;opacity:.8;margin-top:2px;font-family:var(--f-body)}
.go{position:relative;z-index:1;margin-top:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:15px;border-radius:16px;background:var(--sun);color:var(--on-sun);font-weight:800;font-size:17px;box-shadow:0 5px 0 var(--sun-d)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sun-d)}
.go svg{width:20px;height:20px}

/* ---------- journey ---------- */
.unit{margin-top:30px}
.uhead{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:16px 16px 16px 18px;border-radius:22px;color:#fff;background:linear-gradient(135deg,var(--uc),var(--ucd));box-shadow:0 6px 0 color-mix(in srgb,var(--ucd) 75%,#000)}
.uhead .num{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.04em;opacity:.35}
.uhead div{flex:1;min-width:0}
.uhead h2{margin:0;font-size:19px;font-weight:700;line-height:1.25;text-wrap:balance}
.uhead .sub{font-family:var(--f-display);font-size:14px;opacity:.85}
.upips{display:flex;gap:4px;margin-top:6px}
.upips i{width:18px;height:5px;border-radius:9px;background:rgba(255,255,255,.3)}
.upips i.on{background:#fff}
.rule{flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.18);font-weight:700;font-size:13px;color:#fff;box-shadow:0 0 0 1.5px rgba(255,255,255,.4) inset}
.rule svg{width:16px;height:16px}
.unit.locked .uhead{background:var(--lock);color:var(--muted);box-shadow:0 6px 0 var(--lock-d)}
.unit.locked .upips i{background:var(--lock-d)}
.unit.locked .rule{color:var(--muted);background:var(--surface-2);box-shadow:0 0 0 1.5px var(--lock-d) inset}
.road{position:relative;width:300px;max-width:100%;margin:0 auto}
.road svg.trail{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.stop{position:absolute;width:76px;height:72px;margin-left:-38px;margin-top:-40px;border-radius:50%;display:grid;place-items:center;background:var(--uc);box-shadow:0 8px 0 var(--ucd),0 14px 20px -8px color-mix(in srgb,var(--ucd) 70%,transparent);transition:transform .12s}
.stop::after{content:"";position:absolute;inset:7px 12px auto;height:20px;border-radius:50%;background:linear-gradient(rgba(255,255,255,.45),transparent);pointer-events:none}
.stop:active{transform:translateY(5px)}
.stop svg{width:32px;height:32px;color:#fff;position:relative;z-index:1}
.stop.done{background:var(--sun);box-shadow:0 8px 0 var(--sun-d)}
.stop.done svg{color:#5C4500}
.stop.locked{background:var(--lock);box-shadow:0 8px 0 var(--lock-d);cursor:default}
.stop.locked svg{color:var(--muted)}
.stop.locked::after{display:none}
.stop.cur{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 8px 0 var(--ucd),0 0 0 0 color-mix(in srgb,var(--uc) 45%,transparent)}50%{box-shadow:0 8px 0 var(--ucd),0 0 0 14px color-mix(in srgb,var(--uc) 0%,transparent)}}
.start{position:absolute;bottom:calc(100% + 18px);left:50%;transform:translateX(-50%);white-space:nowrap;padding:7px 13px;border-radius:12px;background:var(--uc);color:#fff;font-weight:800;font-size:14px;box-shadow:var(--shadow);animation:bob 1.8s ease-in-out infinite}
.start::after{content:"";position:absolute;top:100%;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:var(--uc)}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.buddy{position:absolute;width:74px;height:74px;margin-top:-46px}
.buddy svg{width:100%;height:100%}
.endnote{padding-block:40px 10px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav .wrap{display:flex;gap:6px;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:14px;color:var(--muted);font-size:12px;font-weight:700}
.nav svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--teal);background:var(--teal-soft)}

/* ---------- cards / lists ---------- */
.ptitle{margin:10px 0 0;font-family:var(--f-display);font-size:28px;font-weight:800;letter-spacing:-.02em}
.card{background:var(--surface);border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 0 0 1px var(--line) inset}
.card h3{margin:0 0 6px;font-size:18px;font-weight:700}
.card p{margin:0;color:var(--muted)}
.card.feature{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--coral-soft),var(--sun-soft));box-shadow:none}
.card.feature svg.m{flex:none;width:84px;height:84px}
.big-n{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;color:var(--coral)}
.whead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.whead b{font-family:var(--f-display);color:var(--muted);font-size:14px}
.wordrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.wordrow:first-of-type{border-top:0}
.wordrow .w{font-family:var(--f-display);font-weight:600;font-size:17px;min-width:0}
.wordrow .w.s{font-size:15px;font-weight:500}
.wordrow .k{margin-left:auto;color:var(--muted);text-align:right;font-size:15px}
.spk{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal)}
.spk svg{width:20px;height:20px}
.cta{display:flex;align-items:center;justify-content:center;width:100%;padding:15px;border-radius:16px;background:var(--coral);color:#fff;font-weight:800;font-size:16px;box-shadow:0 5px 0 var(--coral-d);margin-top:14px;letter-spacing:.01em}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--coral-d)}
.cta[disabled]{background:var(--lock);box-shadow:0 5px 0 var(--lock-d);color:var(--muted);cursor:default;transform:none}
.cta.ghost{background:transparent;color:var(--teal);box-shadow:0 0 0 2px var(--line) inset;margin-top:10px}

/* ---------- lesson player ---------- */
.player{min-height:100%;display:flex;flex-direction:column}
.p-top{display:flex;align-items:center;gap:14px;padding-block:16px 8px}
.x{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;color:var(--muted)}
.x svg{width:24px;height:24px}
.pbar{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar span{position:relative;display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),#38BDF8);transition:width .45s cubic-bezier(.3,1.4,.5,1)}
.pbar span::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:9px;background:rgba(255,255,255,.45)}
.combo{height:22px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:14px;color:var(--coral);opacity:0;transform:translateY(4px);transition:.3s}
.combo.show{opacity:1;transform:none}
.p-body{flex:1;display:flex;flex-direction:column;gap:20px;padding-block:6px 28px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateX(18px)}}
.ask{margin:0;font-size:22px;font-weight:800;line-height:1.3;text-wrap:balance}
.scene{display:flex;align-items:flex-end;gap:10px}
.scene .m{flex:none;width:96px;height:96px}
.speech{position:relative;flex:1;min-width:0;padding:14px 16px;border-radius:18px;background:var(--surface);box-shadow:0 0 0 2px var(--line) inset;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.speech::before{content:"";position:absolute;left:-9px;bottom:16px;width:16px;height:16px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.speech .big{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.speech .ka{font-size:21px;font-weight:700;line-height:1.35}
.speech .mid{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.3}
.hear{display:flex;gap:12px;justify-content:center;align-items:flex-end;padding-block:6px}
.hear button{width:104px;height:104px;border-radius:30px;background:var(--teal);color:#fff;display:grid;place-items:center;box-shadow:0 7px 0 var(--teal-d)}
.hear button:active{transform:translateY(4px);box-shadow:0 3px 0 var(--teal-d)}
.hear button.slow{width:66px;height:66px;border-radius:20px}
.hear svg{width:48px;height:48px}.hear .slow svg{width:30px;height:30px}
.opts{display:grid;gap:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{position:relative;display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:16px;background:var(--surface);box-shadow:0 0 0 2px var(--line) inset,0 4px 0 var(--line);text-align:left;font-size:17px;font-weight:600;min-width:0;transition:transform .08s}
.opt:active{transform:translateY(2px)}
.opt .kbd{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);box-shadow:0 0 0 2px var(--line) inset;font-family:var(--f-display)}
.opt.en-o{font-family:var(--f-display);font-size:19px}
.opt[aria-pressed="true"]{background:var(--teal-soft);color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset,0 4px 0 var(--teal)}
.opt[aria-pressed="true"] .kbd{color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}
.opt.matched{opacity:.3;pointer-events:none;box-shadow:0 0 0 2px var(--line) inset}
.opt.flash{background:var(--bad-bg);color:var(--bad);box-shadow:0 0 0 2px var(--bad) inset,0 4px 0 var(--bad);animation:shake .35s}
.opt.good{background:var(--ok-bg);color:var(--ok);box-shadow:0 0 0 2px var(--ok) inset,0 4px 0 var(--ok)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.answer{min-height:118px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding-block:10px;background:repeating-linear-gradient(transparent 0 54px,var(--line) 54px 56px)}
.bank{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.tile{padding:9px 15px;border-radius:13px;background:var(--surface);box-shadow:0 0 0 2px var(--line) inset,0 4px 0 var(--line);font-family:var(--f-display);font-size:18px;font-weight:600}
.tile.used{background:var(--line);color:transparent;box-shadow:none;pointer-events:none}
.typein{width:100%;padding:16px 18px;border-radius:16px;border:0;box-shadow:0 0 0 2px var(--line) inset;background:var(--surface);color:var(--ink);font-family:var(--f-display);font-size:21px;font-weight:600}
.typein:focus{box-shadow:0 0 0 2px var(--teal) inset;outline:none}
.hint{margin:-8px 0 0;color:var(--muted);font-size:14px}

.sheet{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line)}
.sheet .wrap{padding-block:16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet.ok,.sheet.bad{border-top:0;animation:up .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet.ok{background:var(--ok-bg)}.sheet.bad{background:var(--bad-bg)}
.fb{display:flex;gap:12px;align-items:center}
.fb .m{flex:none;width:58px;height:58px}
.fb div{flex:1;min-width:0}
.fb h4{margin:0;font-size:20px;font-weight:800}
.fb p{margin:2px 0 0;font-size:16px;font-weight:600}
.fb .sub{font-weight:400;font-size:14px;color:var(--muted)}
.sheet.ok h4,.sheet.ok .fb p:not(.sub){color:var(--ok)}
.sheet.bad h4,.sheet.bad .fb p:not(.sub){color:var(--bad)}
.sheet.ok .cta{background:var(--ok);box-shadow:0 5px 0 var(--ok-d)}
.sheet.bad .cta{background:var(--bad);box-shadow:0 5px 0 var(--bad-d)}

/* ---------- result + modal ---------- */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding-block:28px}
.result .m{width:150px;height:150px;animation:hop .9s ease .1s both}
@keyframes hop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08)}100%{transform:none;opacity:1}}
.result h2{margin:6px 0 0;font-family:var(--f-display);font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--coral)}
.result.fail h2{color:var(--bad)}
.result p{margin:0;color:var(--muted);max-width:34ch}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;width:100%;max-width:380px}
.kpi{border-radius:16px;overflow:hidden;box-shadow:0 0 0 2px var(--kc) inset}
.kpi small{display:block;background:var(--kc);color:#fff;font-size:12px;font-weight:800;padding:4px 6px}
.kpi b{display:block;padding:10px 6px;font-family:var(--f-display);font-size:24px;font-weight:800;color:var(--kc);font-variant-numeric:tabular-nums}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.modal{position:fixed;inset:0;z-index:40;background:rgba(6,20,24,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal .panel{width:100%;max-width:540px;max-height:86%;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:24px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:up .3s cubic-bezier(.2,1.1,.4,1)}

const W = (u,i) => ({kind:'w', u, i, en:UNITS[u].w[i][0], ka:UNITS[u].w[i][1]});
const SEN = (u,i) => ({kind:'s', u, i, en:UNITS[u].s[i][0], ka:UNITS[u].s[i][1]});
function wordPool(maxU){ const a=[]; for(let u=0;u<=maxU;u++) UNITS[u].w.forEach((_,i)=>a.push(W(u,i))); return a; }
function distract(item, field, n){
  const same = UNITS[item.u].w.map((_,i)=>W(item.u,i));
  const all = shuffle(same).concat(shuffle(wordPool(Math.max(item.u,1))));
  const base = x => x.replace(/ \(.*\)/,'');
  const out=[], seen=new Set([base(item[field])]), sameKa = base(item.ka);
  for (const w of all){ const k=base(w[field]); if(!seen.has(k) && base(w.ka)!==sameKa){ seen.add(k); out.push(w); } if(out.length>=n) break; }
  return out;
}
function sentDistract(item, n){
  const all=[]; UNITS.forEach((U,u)=>U.s.forEach((_,i)=>{ if(!(u===item.u&&i===item.i)) all.push(SEN(u,i)); }));
  const near = shuffle(all.filter(s=>s.u===item.u)).concat(shuffle(all));
  const out=[]; const seen=new Set([item.ka]); for(const s of near){ if(!seen.has(s.ka)){ seen.add(s.ka); out.push(s);} if(out.length>=n) break; } return out;
}
function makeEx(type, item){
  const ex = {type, item};
  if (type==='pick_ka') ex.opts = shuffle([item, ...distract(item,'ka',3)]).map(w=>w.ka);
  if (type==='pick_en' || type==='listen') ex.opts = shuffle([item, ...distract(item,'en',3)]).map(w=>w.en);
  if (type==='pick_sent') ex.opts = shuffle([item, ...sentDistract(item,2)]).map(s=>s.ka);
  if (type==='build' || type==='build_listen'){
    const words = item.en.replace(/[.,?!]/g,'').split(' ');
    const extra = shuffle(UNITS[item.u].w.map(w=>w[0]).filter(w=>!w.includes(' ') && !words.map(x=>x.toLowerCase()).includes(w.toLowerCase()))).slice(0,3);
    ex.tiles = shuffle(words.concat(extra));
  }
  return ex;
}
function wordType(first){ if (first) return 'pick_ka'; return pick(canSpeak ? ['pick_ka','pick_en','listen'] : ['pick_ka','pick_en']); }
function sentType(){ return pick(canSpeak ? ['build','build','build_listen','pick_sent'] : ['build','build','pick_sent']); }
function buildLesson(u, li){
  const U = UNITS[u], idx = U.w.map((_,i)=>i), sidx = U.s.map((_,i)=>i);
  let wp, sp;
  if (li===0){ wp = idx.slice(0,5); sp = [0,1]; }
  else if (li===1){ wp = idx.slice(4); sp = sidx.slice(1,4); }
  else { wp = shuffle(idx).slice(0,6); sp = shuffle(sidx).slice(0,4); }
  const first = wp.map((i,k)=> makeEx(wordType(li===0 && k<3), W(u,i)));
  const rest = [];
  if (li===0) shuffle(wp).slice(0,2).forEach(i=>rest.push(makeEx('pick_en', W(u,i))));
  else shuffle(wp).slice(0,2).forEach(i=>rest.push(makeEx('type', W(u,i))));
  sp.forEach(i=>rest.push(makeEx(li===0 && i===0 ? 'pick_sent' : sentType(), SEN(u,i))));
  if (speakOn()) (li===0 ? [sp[0]] : shuffle(sp).slice(0, li===2 ? 2 : 1)).forEach(i=>rest.push(makeEx('speak', SEN(u,i))));
  const out = first.concat(shuffle(rest));
  const matchItems = shuffle(li===0 ? idx.slice(0,5) : idx).slice(0,5).map(i=>W(u,i));
  out.splice(Math.min(4,out.length), 0, {type:'match', items:matchItems});
  return out;
}
function buildPractice(){
  const out = [];
  for (const k of shuffle(S.mistakes).slice(0,8)){ const [kind,u,i]=k.split(':'); const item = kind==='w' ? W(+u,+i) : SEN(+u,+i);
    out.push(makeEx(kind==='w' ? (Math.random()<.4?'type':wordType(false)) : sentType(), item)); }
  const learned = []; for(let u=0;u<UNITS.length;u++) if(prog(u)>0) learned.push(u);
  while (out.length < 10 && learned.length){
    const u = pick(learned);
    if (Math.random()<.65){ const i = Math.random()*UNITS[u].w.length|0; out.push(makeEx(Math.random()<.3?'type':wordType(false), W(u,i))); }
    else { const i = Math.random()*UNITS[u].s.length|0; out.push(makeEx(sentType(), SEN(u,i))); }
  }
  if (speakOn() && learned.length){ const u = pick(learned); out.splice(Math.min(5,out.length), 0, makeEx('speak', SEN(u, Math.random()*UNITS[u].s.length|0))); }
  return out;
}

let micBroken = false, rec = null, recTimer = null;

function setMic(state, text){
  const b = $('#mic'), h = $('#micHint'); if (!b) return;
  b.classList.toggle('rec', state==='rec'); b.classList.toggle('busy', state==='busy'); b.disabled = state==='busy';
  h.textContent = text || (state==='rec' ? 'გისმენ… როცა დაამთავრებ, ისევ დააჭირე' : state==='busy' ? 'ვამოწმებ…' : MIC_IDLE);

function micFailed(){
  micBroken = true; setMic('idle', 'მიკროფონზე წვდომა ვერ მივიღე. ნება დართე მიკროფონს ან გამოტოვე ეს სავარჯიშო.');
  const n = $('#nospeak'); if (n) n.textContent = 'გამოტოვება';

async function toggleRec(){
  if (rec && rec.state === 'recording'){ rec.stop(); return; }
  try { speechSynthesis.cancel(); } catch(e) {}
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); } catch(e) { return micFailed(); }
  const mt = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(t => { try { return MediaRecorder.isTypeSupported(t); } catch(e) { return false; } });
  const chunks = [];
  try { rec = mt ? new MediaRecorder(stream, {mimeType: mt}) : new MediaRecorder(stream); } catch(e) { stream.getTracks().forEach(t=>t.stop()); return micFailed(); }
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    stream.getTracks().forEach(t=>t.stop()); clearTimeout(recTimer);
    const type = (rec.mimeType || mt || 'audio/webm').split(';')[0]; rec = null;
    setMic('busy'); sendSpeech(new Blob(chunks, {type}));
  };
  rec.start(); setMic('rec'); haptic('select');
  recTimer = setTimeout(() => { if (rec && rec.state === 'recording') rec.stop(); }, 10000);
}

    const j = await r.json().catch(() => ({}));

}

function speechWords(s){
  if (LANG !== 'en') {
    const nw = LANG === 'de' ? NUMW_DE : [];
    return fold(s).replace(/[’`']/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').split(' ').filter(Boolean).map(w => /^\d+$/.test(w) && nw[+w] ? nw[+w] : w);
  }
  s = ' ' + s.toLowerCase().replace(/[’`]/g, "'") + ' ';
  s = s.replace(/\bcan't\b/g,'can not').replace(/\bwon't\b/g,'will not').replace(/\bcannot\b/g,'can not')
       .replace(/n't\b/g,' not').replace(/'re\b/g,' are').replace(/'m\b/g,' am').replace(/'ll\b/g,' will')
       .replace(/'ve\b/g,' have').replace(/'d\b/g,' would').replace(/'s\b/g,' is');
  return s.replace(/[^a-z0-9']+/g,' ').split(' ').filter(Boolean).map(w => NUMW[+w] && /^\d+$/.test(w) ? NUMW[+w] : w);
}
const wEq = (a, b) => a === b || (a.length >= 4 && lev(a, b) <= 1);
function scoreSpeech(target, heard){
  const toks = target.split(/\s+/), T = [], owner = [];
  toks.forEach((tk, k) => speechWords(tk).forEach(w => { T.push(w); owner.push(k); }));
  const H = speechWords(heard), n = T.length, m = H.length;
  const dp = Array.from({length:n+1}, () => new Array(m+1).fill(0));
  for (let i=1;i<=n;i++) for (let j=1;j<=m;j++) dp[i][j] = wEq(T[i-1],H[j-1]) ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
  const hit = new Array(n).fill(false);
  for (let i=n, j=m; i>0 && j>0;){ if (wEq(T[i-1],H[j-1])){ hit[i-1]=true; i--; j--; } else if (dp[i-1][j] >= dp[i][j-1]) i--; else j--; }
  const tokOk = toks.map((_, k) => owner.every((o, i) => o !== k || hit[i]));
  const html = toks.map((tk, k) => `<span class="${tokOk[k] ? 'hit' : 'miss'}">${esc(tk)}</span>`).join(' ');
  return {score: n ? hit.filter(Boolean).length / n : 0, html};
}
function speechResult(text){
  if (!L || L.ex.type !== 'speak') return;
  const ex = L.ex, {score, html} = scoreSpeech(ex.item.en, text), pct = Math.round(score*100), ok = score >= 0.75;
  L.state = 'fb';
  const sheet = $('#sheet'), heard = text.trim() ? `გავიგე: „${esc(text.trim())}" · ${pct}%` : 'ვერაფერი გავიგე';
  if (ok){
    L.right++; L.combo++; sfx.ok(); haptic('success'); afterSpeak();
    sheet.className = 'sheet ok';
    sheet.innerHTML = `<div class="wrap"><div class="fb">${goki(pct===100?'wow':'happy')}<div><h4>${pick(['შესანიშნავი გამოთქმა!','ძალიან კარგად თქვი!','ყოჩაღ, გასაგებად ილაპარაკე!'])}</h4><p class="said">${html}</p><p class="sub">${heard}</p></div></div><button class="cta" id="next">გაგრძელება</button></div>`;
    showCombo();
  } else {
    L.combo = 0; sfx.bad(); haptic('error');
    sheet.className = 'sheet bad';
    sheet.innerHTML = `<div class="wrap"><div class="fb">${goki('sad')}<div><h4>კიდევ ერთხელ სცადე</h4><p class="said">${html}</p><p class="sub">${heard}. წითლად მონიშნული სიტყვები ვერ გავიგე.</p></div><button class="spk" data-say="${esc(ex.item.en)}" aria-label="მოუსმინე">${ICON.spk}</button></div>
      <div class="row"><button class="cta ghost" id="retry">კიდევ ვცდი</button><button class="cta" id="next">გაგრძელება</button></div></div>`;
    L.right++;
  }
  document.querySelector('.p-top').outerHTML = headerHTML();
  const b = $('#mic'); if (b){ b.disabled = true; b.classList.remove('busy'); }
  const h = $('#micHint'); if (h) h.textContent = '';
  $('#next').focus();
}
function noSpeak(){
  if (!micBroken){ try { localStorage.setItem(NOSPEAK_KEY, String(Date.now() + 3600e3)); } catch(e) {} }
  const before = L.q.length;
  L.q = L.q.filter((e, i) => i <= L.pos || e.type !== 'speak');
  L.total = Math.max(1, L.total - (before - L.q.length));
  L.right++; L.state = 'fb'; next();
}

// ====================== EVENTS ======================
document.addEventListener('click', e=>{
  const t = e.target.closest('button'); if (!t) return;
  if (featureClick(t)) return;
  if (t.dataset.say !== undefined){ say(t.dataset.say, t.hasAttribute('data-slow')); return; }
  if (t.dataset.go){ view = t.dataset.go; render(); window.scrollTo(0,0); return; }
  if (t.dataset.tip !== undefined){ showTip(+t.dataset.tip); return; }
  if (t.dataset.lesson){ if (t.getAttribute('aria-disabled')) return; const [u,li]=t.dataset.lesson.split(':').map(Number); startLesson(u,li,false); return; }
  if (t.hasAttribute('data-practice')){ startLesson(0,0,true); return; }
  if (t.id==='home'){ view='path'; refreshDay(); render(); window.scrollTo(0,0); return; }
  if (t.hasAttribute('data-quit')){ goBack(); return; }
  if (L && t.id==='retry'){ renderEx(); return; }
  if (!L || L.state!=='ask'){ if (t.id==='next') next(); return; }
  if (t.id==='mic'){ toggleRec(); return; }
  if (t.id==='nospeak'){ noSpeak(); return; }
  const ex = L.ex;
  if (t.dataset.opt !== undefined) selectOpt(t);
  else if (t.dataset.tile !== undefined){ L.answer.push(+t.dataset.tile); say(ex.tiles[+t.dataset.tile]); renderAnswer(); }
  else if (t.dataset.untile !== undefined){ L.answer.splice(+t.dataset.untile,1); renderAnswer(); }
  else if (t.dataset.ml !== undefined || t.dataset.mr !== undefined) matchTap(t);
  else if (t.id==='check') check();
});
function selectOpt(t){
  document.querySelectorAll('[data-opt]').forEach(b=>b.setAttribute('aria-pressed', b===t));
  L.answer = +t.dataset.opt; $('#check').disabled = false; sfx.pop(); haptic('select');
  if (t.dataset.sayopt) say(t.dataset.sayopt);
}
function matchTap(t){
  const ex = L.ex, side = t.dataset.ml !== undefined ? 'l' : 'r', k = +(t.dataset.ml ?? t.dataset.mr);
  if (side==='l') say(ex.left[k].en);
  document.querySelectorAll(side==='l'?'[data-ml]':'[data-mr]').forEach(b=>b.setAttribute('aria-pressed', b===t));
  ex.sel[side] = k;
  if (ex.sel.l === undefined || ex.sel.r === undefined) return;
  const lb = $(`[data-ml="${ex.sel.l}"]`), rb = $(`[data-mr="${ex.sel.r}"]`);
  if (ex.left[ex.sel.l] === ex.right[ex.sel.r]){
    [lb,rb].forEach(b=>{ b.setAttribute('aria-pressed','false'); b.classList.add('good'); setTimeout(()=>{ b.classList.remove('good'); b.classList.add('matched'); },320); });
    ex.done++; tone([[700+ex.done*60,.1]]); haptic('select');
    if (ex.done === ex.items.length){ L.right++; L.state='fb'; setTimeout(()=>{ L.pos++; if (L.pos>=L.q.length) finish(); else renderEx(); }, 650); }
  } else {
    [lb,rb].forEach(b=>{ b.setAttribute('aria-pressed','false'); b.classList.add('flash'); setTimeout(()=>b.classList.remove('flash'),420); });
    sfx.bad();
  }
  ex.sel = {};
}
document.addEventListener('keydown', e=>{
  if (!L || document.querySelector('.modal')) return;
  if (e.key==='Enter'){
    if (L.state==='ask' && $('#check') && !$('#check').disabled){ e.preventDefault(); check(); }
    else if (L.state==='fb' && $('#next')){ e.preventDefault(); next(); }
  } else if (L.state==='ask' && /^[1-4]$/.test(e.key) && document.activeElement?.id!=='typein'){
    const b = $(`[data-opt="${+e.key-1}"]`); if (b) selectOpt(b);
  }
});
if (tg) { $('#app').innerHTML = '<div style="display:grid;place-items:center;height:100%;color:var(--muted)">იტვირთება…</div>'; setTimeout(()=>{ if (!booted) { booted = true; render(); } }, 3000); } else render();
</script>
